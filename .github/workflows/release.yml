# Builds selfaction for Linux, macOS and Windows (amd64 and arm64) when a
# version tag is pushed, and publishes the archives and their checksums as a
# GitHub release:
#
#   git tag v0.3.0 && git push origin v0.3.0
#
# It runs on a selfaction agent by default. Set the RELEASE_RUNS_ON repository
# variable to a JSON label list, e.g. ["ubuntu-latest"], to use another runner.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ${{ fromJSON(vars.RELEASE_RUNS_ON || '["self-hosted", "selfaction-local"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: go test ./...
      - run: scripts/release.sh "$GITHUB_REF_NAME" dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
