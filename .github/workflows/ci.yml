name: ci
on:
  push:
    paths-ignore: ['site/**']
  pull_request:
    paths-ignore: ['site/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o bin/selfaction .
